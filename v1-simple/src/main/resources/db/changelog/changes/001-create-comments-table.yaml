databaseChangeLog:
  - changeSet:
      id: 001-create-comments-table
      author: vkurov
      comment: Создание таблицы comments для MVP
      changes:
        - createTable:
            tableName: comments
            remarks: Комментарии к постам/статьям
            columns:
              - column:
                  name: id
                  type: INTEGER
                  constraints:
                    primaryKey: true
                    nullable: false
                  remarks: Уникальный идентификатор комментария
              - column:
                  name: author
                  type: INTEGER
                  constraints:
                    nullable: false
                  remarks: Идентификатор автора
              - column:
                  name: post_id
                  type: INTEGER
                  constraints:
                    nullable: false
                  remarks: Идентификатор поста/статьи
              - column:
                  name: text
                  type: VARCHAR(1024)
                  constraints:
                    nullable: false
                  remarks: Текст комментария
              - column:
                  name: likes
                  type: INTEGER
                  defaultValue: 0
                  constraints:
                    nullable: false
                  remarks: Количество лайков
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
                  remarks: Время создания (UTC)
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: true
                  remarks: Время последнего обновления

        - createIndex:
            tableName: comments
            indexName: idx_post_created
            columns:
              - column:
                  name: post_id
              - column:
                  name: created_at
                  descending: true
            remarks: Индекс для выгрузки комментариев поста по дате

        - createIndex:
            tableName: comments
            indexName: idx_post_likes
            columns:
              - column:
                  name: post_id
              - column:
                  name: likes
                  descending: true
            remarks: Индекс для сортировки по популярности

        - sql:
            sql: |
              ALTER TABLE comments ADD CONSTRAINT chk_likes_non_negative 
              CHECK (likes >= 0);
            comment: Проверка, что количество лайков не может быть отрицательным