version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: comments-postgres
    environment:
      POSTGRES_DB: comments_db
      POSTGRES_USER: comment_user
      POSTGRES_PASSWORD: comment_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comment_user -d comments_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - comments-app-network

  comments-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: weightop-comments:latest
    container_name: comments-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/comments_db
      SPRING_DATASOURCE_USERNAME: comment_user
      SPRING_DATASOURCE_PASSWORD: comment_pass
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - comments-app-network

volumes:
  postgres_data:
    name: comments-app-postgres-data

networks:
  comments-app-network:
    name: comments-app-network
    driver: bridge
